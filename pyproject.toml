[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-handoff-runner"
version = "0.1.0"
description = "Offline runner and trace fixtures for the handoff study"
requires-python = ">=3.11"
authors = [{name = "Ahmed Tariq"}]

[project.scripts]
swarm-handoff = "swarm_handoff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
